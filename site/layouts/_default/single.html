{{ define "main" }}
<article>
  <h1>{{ .Title }}</h1>
  {{- with .Params.period }}
  <dl class="record">
    <dt>기간</dt>
    <dd>{{ . }}</dd>
    {{- with $.Params.status }}
    <dt>상태</dt>
    <dd><span class="status">{{ . }}</span>{{ with $.Params.statusNote }} {{ . }}{{ end }}</dd>
    {{- end }}
    {{- with $.Params.tools }}
    <dt>도구</dt>
    <dd>{{ . }}</dd>
    {{- end }}
  </dl>
  {{- end }}
  {{ .Content }}
</article>
{{ end }}
