<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 416" font-family="'IBM Plex Sans KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <style>
    .bg{fill:#ffffff}.box{fill:#f4f5f7;stroke:#cdd3db}.hot{stroke:#23663a}.bar{fill:#23663a}.v{fill:#18202b}.k{fill:#4b5563}
    @media (prefers-color-scheme: dark){.bg{fill:#1c222b}.box{fill:#15191f;stroke:#364050}.hot{stroke:#74c98f}.bar{fill:#74c98f}.v{fill:#e6e9ee}.k{fill:#a9b2be}}
  </style>
  <rect class="bg" width="400" height="416"/>
  <rect x="0" y="0" width="400" height="3" class="bar"/>
  <text x="20" y="38" font-size="19" font-weight="700" class="v">재구축 후: OpenStack Gazpacho</text>
  <rect x="16" y="56" width="368" height="64" rx="3" class="box" stroke-width="1"/>
  <text x="28" y="80" font-size="13.5" class="k">사용자 화면</text>
  <text x="28" y="106" font-size="16.5" class="v">Skyline (관리용 Horizon은 따로)</text>
  <rect x="16" y="126" width="368" height="64" rx="3" class="box" stroke-width="1"/>
  <text x="28" y="150" font-size="13.5" class="k">OpenStack 서비스</text>
  <text x="28" y="176" font-size="16.5" class="v">Kolla-Ansible이 띄운 컨테이너</text>
  <rect x="16" y="196" width="368" height="64" rx="3" class="box" stroke-width="1"/>
  <text x="28" y="220" font-size="13.5" class="k">컨트롤러</text>
  <text x="28" y="246" font-size="16.5" class="v">3대, Ubuntu 24.04</text>
  <rect x="16" y="266" width="368" height="64" rx="3" class="box" stroke-width="1"/>
  <text x="28" y="290" font-size="13.5" class="k">설정</text>
  <text x="28" y="316" font-size="16.5" class="v">globals.yml과 인벤토리 한곳, Git 관리</text>
  <rect x="16" y="336" width="368" height="64" rx="3" class="box" stroke-width="1"/>
  <text x="28" y="360" font-size="13.5" class="k">VM 디스크, 볼륨, 이미지</text>
  <text x="28" y="386" font-size="16.5" class="v">Ceph Squid (cephadm)</text>
</svg>
