# 배포 주소. Actions에서는 pages.json과 SITE_BASE_URL이 같은 값을 넣는다.
baseURL = "https://atmigtnca.github.io/"

# 사이트 기본 정보
title = "서종호"
author = "서종호"
copyright = "© 2026 서종호"
locale = "ko"
defaultContentLanguage = "ko"

# 검색엔진용 robots.txt 생성
enableRobotsTXT = true

# 태그를 쓰지 않으므로 태그 목록 페이지를 만들지 않는다.
disableKinds = ["taxonomy", "term"]

[menus]
  [[menus.main]]
    name = "소개"
    pageRef = "/about"
    weight = 10
  [[menus.main]]
    name = "활동"
    pageRef = "/projects"
    weight = 20
  [[menus.main]]
    name = "이 사이트에 대해"
    pageRef = "/colophon"
    weight = 30

[params]
  # 페이지에 설명이 없을 때 meta description으로 쓴다.
  description = "전북대학교 컴퓨터인공지능학부 학생 서종호의 포트폴리오. 연구실 프라이빗 클라우드 JCloud를 운영하고 2026년 여름에 다시 지은 기록을 정리했다."

  # Open Graph site_name
  title = "서종호 포트폴리오"

# 목차는 h2만, 코드 강조는 테마 기본 색
[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2
    ordered = false
  [markup.highlight]
    style = 'friendly'
    lineNos = false
    codeFences = true
